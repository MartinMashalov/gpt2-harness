name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ruff + pytest (CPU, offline)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU-only torch, no CUDA wheels)
        # torch is pinned to the same range the package declares: torch.load
        # changed its weights_only default in 2.6 and an unpinned install here
        # would silently drift out of the supported range.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<2.6"
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The runner has no GPU, no network and no GPT-2 checkpoint. Everything
        # that needs the published weights is marked `weights` and deselected;
        # what remains still covers the tokenizer algorithm, the causal mask, the
        # naive-reference attention comparison, KV-cache equivalence, the
        # quantization arithmetic, pruning accounting and training determinism.
        #
        # It also covers the whole training-infrastructure half. Those tests
        # start real `torch.distributed` process groups, but on the gloo backend
        # with world sizes of 2 and 4, rendezvous through a FileStore or a
        # loopback TCP port, and no GPU, no NCCL and no network access. They are
        # the reason this workflow is worth running: the parallelism equivalence
        # proofs are exactly the part that has to hold on any machine.
        #
        # Invoked as the bare `pytest` entry point on purpose, because that is
        # what breaks differently from `python -m pytest`: the latter puts the
        # working directory on sys.path and can mask a packaging mistake. The
        # package is installed with `pip install -e .` above, so imports must
        # resolve through the installed distribution and not through the cwd.
        env:
          PYTHONHASHSEED: "0"
        run: pytest -q -m "not weights" --durations=10

      - name: Figures redraw from the committed results
        # All twelve figures, including the three from the training-infrastructure
        # half, are drawn only from the JSON committed under results/. If this
        # step fails, a figure is reading something that is not in the repository.
        run: python scripts/make_figures.py --assets /tmp/assets_ci

      - name: The CUDA decisions, resolved against a fabricated 8-GPU node
        # No CUDA on this runner and none needed. Every backend, placement and
        # mixed-precision decision the GPU run would make is a pure function of
        # a Capabilities snapshot, so a stubbed one exercises all of them. This
        # is the step that keeps the CUDA path from rotting between GPU runs.
        run: |
          python scripts/gpu_preflight.py --dry-run --stub-gpus 8 --stub-capability 8.0
          python scripts/gpu_preflight.py --dry-run --stub-gpus 8 --stub-capability 9.0
          # Pre-Ampere must refuse bf16, and two GPUs must refuse eight ranks.
          ! python scripts/gpu_preflight.py --dry-run --stub-gpus 2 --world-sizes 8

      - name: The GPU runner script, end to end at tiny sizes
        # Proves the one-command entry point still works: stage ordering, the
        # resume markers, the per-stage logs and the results diff. The heavy
        # stages are left out because the step above already ran the tests and
        # this runner has no GPU to make them interesting.
        run: |
          ./scripts/run_on_gpu.sh --smoke --infra-only --skip-install --skip-tests \
            --stages preflight,parallel,collectives,figures,summary
          # And it must be idempotent: a second invocation skips everything.
          ./scripts/run_on_gpu.sh --smoke --infra-only --skip-install --skip-tests \
            --stages preflight,parallel,collectives,figures,summary | tee /tmp/second.log
          grep -q "skip   parallel" /tmp/second.log
